# CELERITY Panel - Coolify deployment
#
# Coolify/Traefik terminates TLS and routes the public domain to backend:3000.
# Do not bind 80/443 here; those ports belong to Coolify proxy.

services:
  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - default
      - coolify

  mongo:
    image: public.ecr.aws/docker/library/mongo:7
    restart: always
    environment:
      MONGO_INITDB_DATABASE: hysteria
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-hysteria}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mongo_data:/data/db
    networks:
      - default
      - coolify

  backend:
    build: .
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      NODE_ENV: production
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MONGO_USER: ${MONGO_USER:-hysteria}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
      MONGO_URI: mongodb://${MONGO_USER:-hysteria}:${MONGO_PASSWORD:?MONGO_PASSWORD is required}@mongo:27017/hysteria?authSource=admin
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      PORT: 3000
      USE_CADDY: "true"
      PANEL_IP_WHITELIST: ${PANEL_IP_WHITELIST:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      FEATURE_CASCADE_HYBRID: ${FEATURE_CASCADE_HYBRID:-false}
    volumes:
      - app_logs:/app/logs
      - app_backups:/app/backups
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.services.http-0-${COOLIFY_RESOURCE_UUID}.loadbalancer.server.port=3000
      - traefik.http.services.https-0-${COOLIFY_RESOURCE_UUID}.loadbalancer.server.port=3000
      - traefik.http.routers.http-0-${COOLIFY_RESOURCE_UUID}-backend.entryPoints=http
      - traefik.http.routers.http-0-${COOLIFY_RESOURCE_UUID}-backend.middlewares=redirect-to-https
      - traefik.http.routers.http-0-${COOLIFY_RESOURCE_UUID}-backend.rule=Host(`${PANEL_DOMAIN}`) && PathPrefix(`/`)
      - traefik.http.routers.http-0-${COOLIFY_RESOURCE_UUID}-backend.service=http-0-${COOLIFY_RESOURCE_UUID}
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-backend.entryPoints=https
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-backend.middlewares=gzip
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-backend.rule=Host(`${PANEL_DOMAIN}`) && PathPrefix(`/`)
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-backend.tls=true
      - traefik.http.routers.https-0-${COOLIFY_RESOURCE_UUID}-backend.service=https-0-${COOLIFY_RESOURCE_UUID}
      - caddy_0.encode=zstd gzip
      - caddy_0.handle_path.0_reverse_proxy={{upstreams}}
      - caddy_0.handle_path=/*
      - caddy_0.header=-Server
      - caddy_0.try_files={path} /index.html /index.php
      - caddy_0=https://${PANEL_DOMAIN}
      - caddy_ingress_network=${COOLIFY_RESOURCE_UUID}
    networks:
      - default
      - coolify

volumes:
  mongo_data:
  app_logs:
  app_backups:

networks:
  coolify:
    external: true
